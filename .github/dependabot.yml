# Abre pull requests semanais para atualizar as actions do workflow (os SHAs fixados
# no build.yml, com o comentário da versão).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # Agrupa todas as atualizações de actions num PR só por semana.
    groups:
      actions-github:
        patterns:
          - "*"
  # Gradle: atualizações semanais em um PR só. Versões fixas do projeto (AGP, Kotlin, Gradle) ficam de fora.
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    groups:
      gradle-deps:
        patterns:
          - "*"
    ignore:
      - dependency-name: "com.android.tools.build:gradle"
      - dependency-name: "com.android.application"
      - dependency-name: "com.android.library"
      - dependency-name: "org.jetbrains.kotlin*"
      - dependency-name: "gradle"
